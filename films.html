<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anime Scout · Фильмы</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f3f4f6;font:15px system-ui}main{max-width:740px;margin:auto;padding:22px 16px 80px}a{color:#a5b4fc}section,.card{background:#171e30;border:1px solid #30384a;border-radius:16px;padding:15px;margin:14px 0}input,button{font:inherit;border-radius:10px;padding:12px}input{width:100%;background:#0c1324;border:1px solid #465066;color:white}button{border:0;background:#6366f1;color:white;cursor:pointer;margin:8px 6px 0 0}button.secondary{background:#30394f}.poster{width:100%;max-height:220px;object-fit:contain;background:#0c1324;border-radius:8px}.muted{color:#aab2c1}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}small{color:#aab2c1}</style></head><body><main><a href="./index.html">← Anime Scout</a><h1>🎬 Поиск фильмов</h1><p class="muted">Найди до 10 видеоматериалов, выбери подходящие и сохрани подборку. Источник: Internet Archive.</p><section><label for="q">Название фильма</label><input id="q" value="Matrix" placeholder="Matrix"><button id="search">Найти 10 видео</button><button class="secondary" id="saved">Сохранённые</button><button class="secondary" id="export">Экспорт JSON</button><p id="status" role="status" aria-live="polite"></p><small>Поиск показывает видеоматериалы, не гарантирует наличие сцен фильма или разрешение на повторное использование. Скачивания и монтажа пока нет.</small></section><div id="results"></div></main><script>
const KEY='anime-scout-films-v1',q=document.getElementById('q'),status=document.getElementById('status'),results=document.getElementById('results');let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch{};let current=[];
const node=(tag,text)=>{let e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e};
function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved))}catch{status.textContent='Не удалось сохранить в браузере'}}
function render(items){results.replaceChildren();if(!items.length){results.append(node('p','Материалы не найдены.'));return}for(const item of items){let c=node('article');c.className='card';let h=node('h3',item.title);c.append(h);if(item.thumb){let img=node('img');img.className='poster';img.src=item.thumb;img.loading='lazy';img.alt='Обложка материала';img.onerror=()=>img.remove();c.append(img)}c.append(node('p',item.year?'Год: '+item.year:''));let link=node('a','Открыть на Internet Archive ↗');link.href=item.url;link.target='_blank';link.rel='noopener noreferrer';c.append(link);let p=node('p');p.className='muted';p.textContent='Выбор: '+(saved[item.id]?.decision==='approved'?'сохранено':saved[item.id]?.decision==='rejected'?'отклонено':'не выбрано');c.append(p);let yes=node('button','✓ Сохранить');yes.onclick=()=>{saved[item.id]={...item,decision:'approved'};persist();render(items)};let no=node('button','Отклонить');no.className='secondary';no.onclick=()=>{saved[item.id]={...item,decision:'rejected'};persist();render(items)};c.append(yes,no);results.append(c)}}
async function search(){let term=q.value.trim();if(!term){status.textContent='Введите название фильма';return}status.textContent='Ищем видеоматериалы…';results.replaceChildren();try{const query='title:('+term.replace(/[^\p{L}\p{N} -]/gu,' ').trim().split(/\s+/).map(x=>'"'+x+'"').join(' AND ')+') AND mediatype:movies';const u='https://archive.org/advancedsearch.php?q='+encodeURIComponent(query)+'&fl%5B%5D=identifier&fl%5B%5D=title&fl%5B%5D=year&rows=10&page=1&output=json';const res=await fetch(u);if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();const docs=data.response?.docs||[];current=docs.filter(x=>typeof x.identifier==='string').slice(0,10).map(x=>({id:x.identifier,title:Array.isArray(x.title)?x.title[0]:x.title||x.identifier,year:x.year||'',url:'https://archive.org/details/'+encodeURIComponent(x.identifier),thumb:'https://archive.org/services/img/'+encodeURIComponent(x.identifier),source:'internet_archive',rights:'unverified'}));status.textContent='Найдено: '+current.length+' из 10. Проверь каждый источник перед использованием.';render(current)}catch(e){status.textContent='Поиск не удался: '+e.message+'. Возможно, Archive.org блокирует запрос браузера. Попробуй позже.'}}
document.getElementById('search').onclick=search;document.getElementById('saved').onclick=()=>{current=Object.values(saved).filter(x=>x.decision==='approved');status.textContent='Сохранено: '+current.length;render(current)};document.getElementById('export').onclick=()=>{const data={schema_version:1,type:'film_candidates',rights:'unverified',items:Object.values(saved).filter(x=>x.decision==='approved')};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=node('a');a.href=url;a.download='anime_scout_films.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};
</script></body></html>
